<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <meta http-equiv="Content-Security-Policy"
  
    content= "default-src 'self'; 
    script-src 'self'; 
    style-src 'self'; 
    img-src 'self' data: https:; 
    font-src 'self' data:; 
    connect-src 'self'; 
    base-uri 'self'; 
    form-action 'self'; 
    manifest-src 'self'; 
    worker-src 'self'; 
    frame-ancestors 'self'; 
    upgrade-insecure-requests
  ">
  <title>色見本</title>
  
  <link rel="stylesheet" href="./style.css">
  
  <link rel="manifest"
  href="./manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">


</head>

<body>
  <div id="color-picker-screen">
    <div class="app-header">
    </div>
    <div class="color-container">
      カラーピッカー ↓ タッチするとパレットが開くよ
      <!-- ピッカー -->
      <input type="color" id="colorPicker" value="#ffffff">
      <!-- 色見本（プレビュー） -->
      <div class="preview-box" id="preview">
        <canvas id="myCanvas"></canvas>
      </div>
      <!-- 手入力エリア -->
      <div class="color-input-div">
        <div class="input-wrapper">
          <input type="text" id="colorInput" placeholder="半角のみ (例:123abc, #123abc)" maxlength="7">
          <div class="error-msg" id="errorMsg">無効な文字があります</div>
        </div>
      </div>
      <!-- RGB 表示 -->
      <div class="rgb-display">
        <div class="rgb-item">
          <span class="rgb-label">R</span>
          <span class="rgb-val" id="rVal">FF</span>
        </div>
        <div class="rgb-item">
          <span class="rgb-label">G</span>
          <span class="rgb-val" id="gVal">FF</span>
        </div>
        <div class="rgb-item">
          <span class="rgb-label">B</span>
          <span class="rgb-val" id="bVal">FF</span>
        </div>
      </div>
      <button class="yellow-btn nice-push" id="saveBtn">💾 色を保存</button>
      <!-- 保存リスト -->
      <h3 class="color-saved-msg">保存済み (クリックでコピー)</h3>
      <ul class="saved-list" id="savedList"></ul>
    </div>
    <!-- サイズ設定 -->
    <div class="size-settings">
      <div class="size-input">
        <label>幅 (px)</label>
        <input type="number" id="width" value="1000" min="1" max="5000">
      </div>
      <div class="size-input">
        <label>高さ (px)</label>
        <input type="number" id="height" value="1000" min="1" max="5000">
      </div>
    </div>
    
    <!-- ボタン -->
    <button class="green-btn nice-push" id="downloadBtn">⬇️ 画像をダウンロード</button>
    
  </div>
  
  
  <script src="./script.js"defer></script>
  
</body>

</html>
