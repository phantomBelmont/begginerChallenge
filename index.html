<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐣試作品🐵</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4B0082">
  <link rel="icon" type="image/png" href="icon192.png">
  <link rel="apple-touch-icon" href="icon192.png">
  
<!-- 安全な CSP の設定例 -->
    <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self';
    img-src 'self' data: https:;
    font-src 'self' data:;
    connect-src 'self';
    base-uri 'self';
    form-action 'self';
    worker-src 'self';
    upgrade-insecure-requests;
    block-all-mixed-content;
    ">

    <meta name="referrer" content="strict-origin-when-cross-origin">

  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
  

</head>
<body>
    <div class="stars"></div>
    <div class="ocean">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>
   <!-- メニュー画面 -->
    <div id="menu-screen">
        <h1 class="menu-title"><span class="moon">🌙メニュー</span></h1>
        
        <button class="menu-btn memoApp" id="btn-memoapp-id">
            <span>📝 一時メモ帳</span>
        </button>        
        <button class="menu-btn find-replace" id="btn-find-replace-id">
            <span>🔍 検索 & 置換</span>
        </button>
        <button class="menu-btn single-palette" id="btn-color-picker-id">
            <span>🎨 色見本＆ダウンロード</span>
        </button>
        <button class="menu-btn template-storage" id="btn-template-storage-id">
            <span>📦 テンプレート倉庫</span>
        </button>
    </div>

    <!-- 検索＆置換-->
    <div id="findReplace-screen">
        <div class="app-header">
            <button class="goToMenu-btn">←🌙メニューへ</button>
            <h1 class="h1class">検索 & 置換</h1>
        </div>
        <div class="textinputDiv">
            <label>対象テキスト</label>
            <textarea id="yourtext"  placeholder="ここにテキストを貼り付けて..."></textarea>
        </div>
        <div class="group-o-inputgroups">
            <div class="find-or-replace-input">
                <label>探す言葉</label>
                <input type="text" class="FnRinput" id="find" placeholder="例：Apple">
            </div>
            <div class="find-or-replace-input">
                <label>置換する言葉</label>
                <input type="text" class="FnRinput" id="replace" placeholder="例：Orange">
            </div>
        </div>
        <div class="replace-reset-btns">
            <button id="btn-execute"  class="yellow-btn nice-push">置換実行</button>
            <button id="btn-reset" class="red-btn nice-push">すべてリセット</button>
        </div>
        <p id="error-msg">「探す言葉」を入力してください。</p>
        <div class="result-area">
            <div class="FnR-result-box" id="result">ここに結果が表示されます</div>
                <button id="btn-FnR-copy" class="green-btn nice-push">全選択＆コピー</button>
            </div>
        </div>
    </div>
    
    <!-- カラーピッカー色見本＆ダウンロード -->
     <div id="color-picker-screen">
        <div class="app-header">
            <button class="goToMenu-btn">←🌙メニューへ</button>
            <h1 class="h1class">色見本＆ダウンロード</h1>
        </div>
        <div class="color-container">
            カラーピッカー ↓ タッチするとパレットが開くよ
            <!-- ピッカー -->
            <input type="color" id="colorPicker" value="#ffffff">
            <!-- 色見本（プレビュー） -->
            <div class="preview-box" id="preview">
                <canvas id="myCanvas"></canvas>
            </div>
            <!-- 手入力エリア -->
            <div class="color-input-div">
                <div class="input-wrapper">
                    <input type="text" id="colorInput" placeholder="半角のみ (例:123abc, #123abc)" maxlength="7">
                    <div class="error-msg" id="errorMsg">無効な文字があります</div>
                </div>
            </div>
            <!-- RGB 表示 -->
            <div class="rgb-display">
                <div class="rgb-item">
                    <span class="rgb-label">R</span>
                    <span class="rgb-val" id="rVal">FF</span>
                </div>
                <div class="rgb-item">
                    <span class="rgb-label">G</span>
                    <span class="rgb-val" id="gVal">FF</span>
                </div>
                <div class="rgb-item">
                    <span class="rgb-label">B</span>
                    <span class="rgb-val" id="bVal">FF</span>
                </div>
            </div>
            <button class="yellow-btn nice-push" id="saveBtn">💾 色を保存</button>
            <!-- 保存リスト -->
            <h3 class="color-saved-msg">保存済み (クリックでコピー)</h3>
            <ul class="saved-list" id="savedList"></ul>
            </div>
            <!-- サイズ設定 -->
            <div class="size-settings">
                <div class="size-input">
                    <label>幅 (px)</label>
                    <input type="number" id="width" value="1000" min="1" max="5000">
                </div>
                <div class="size-input">
                    <label>高さ (px)</label>
                    <input type="number" id="height" value="1000" min="1" max="5000">
                </div>
            </div>
            
            <!-- ボタン -->
            <button class="green-btn nice-push" id="downloadBtn">⬇️ 画像をダウンロード</button>

    </div>

    <!--テンプレート倉庫-->
    <div id="template-storage-screen">
        <div class="app-header">
            <button class="goToMenu-btn">←🌙メニューへ</button>
            <h1 class="h1class">📦 テンプレート倉庫</h1>
        </div>
        <div class="template-container">
            <!-- 入力エリア -->
            <div class="template-input-area">
                <input type="text" id="title" placeholder="タイトル（例：絵文字に影をつける）">
                <textarea id="code" placeholder="コード（HTML/CSSなど）"></textarea>
                <p class="tate-msg">ひっぱると、たてに伸びるよ ↑</p>
                <button id="add-template" class="green-btn nice-push">テンプレート追加</button>
                <button id="ts-reset-input" class="yellow-btn nice-push"> 上記をリセット</button>

            </div>
            <!-- コード表示エリア -->
            <div id="code-display-area">
                <div class="code-header">
                    <h3 id="display-title">タイトル</h3>
                    <button class="yellow-btn nice‐push" id="close-display">&times;</button>
                </div>
                <div id="code-text"></div>
                <button class="green-btn nice‐push" id="ct-copy-btn-id">全コピー</button>
            </div>
            <!-- リストエリア -->
            <div class="list-section" id="list-section">
                <div class="list-header">
                    <h3>登録済みテンプレート</h3>
                </div>
                <ul class="template-list" id="template-list">
                    <!-- ここにアイテムが追加されます -->
                </ul>
                <button id="delete-selected-btn" class="red-btn nice-push" disabled>選択したものを削除</button>
                <div class="empty-state" id="empty-msg">
                    テンプレートが登録されていません。上から追加してください！
                </div>
            </div>
        </div>
        <div id="telling-id">メモコピーしました！</div>
    </div>

    <!-- 📝一時メモ帳 -->
    <div id="memoApp-screen">
        <div class="app-header">
            <button class="goToMenu-btn">←🌙メニューへ</button>
            <h1 class="h1class">📝 一時メモ帳</h1>
        </div>
        <div class="app-container">
            <!-- サイドバー -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-title">メモ帳</div>
                    <button class="green-btn nice-push" id="btnNewNote">+ 新規</button>
                </div>
                <div class="note-list" id="noteList">
                    <!-- メモアイテムがここに入る -->
                </div>
            </div>

            <!-- メインエリア -->
            <div class="memo-main-area">
                <button class="mobile-toggle nice-push" id="mobileToggle">☰</button>
                
                <div class="editor-header">
                    <input type="text" class="editor-title-input" id="noteTitle" placeholder="タイトル">
                    <div class="editor-actions">
                        <button id="memobtnCopySelection" class="green-btn nice-push">📋全選択&コピー</button>
                        <button id="btn-quick-clear" class="yellow-btn nice-push">🧹クリア</button> 
                        <button class="memo-delete-btn red-btn nice-push" id="btnDeleteNote">🗑 削除</button>
                    </div>
                </div>

                <div class="status-bar">
                    <span id="saveStatus">保存済み</span>
                    <span id="charCount">0 文字</span>
                </div>

                <textarea id="noteArea" placeholder="ここにメモを入力してください..."></textarea>
            </div>
        </div>
    </div>
</body>
</html>
